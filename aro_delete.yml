---
# Description
# ===========
# Deletes an Azure Red Hat OpenShift cluster (classic or HCP) and,
# optionally, its resource group.
#
#   ansible-playbook aro_delete.yml                          # interactive
#   ansible-playbook aro_delete.yml -e aro_architecture=hcp
#   ansible-playbook aro_delete.yml -e auto_approve=true -e delete_resource_group=true   # CI / AAP

- name: Delete Azure Red Hat OpenShift Cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/aro_vars.yml
  vars:
    auto_approve: false
    delete_resource_group: false

  tasks:
    - name: Validate architecture choice
      ansible.builtin.assert:
        that: aro_architecture in ['classic', 'hcp']
        quiet: true

    - name: Verify Azure CLI is installed and authenticated
      ansible.builtin.command: az account show -o json
      register: az_account
      changed_when: false

    - name: Record subscription and command prefix
      ansible.builtin.set_fact:
        az_subscription_id: "{{ (az_account.stdout | from_json).id }}"
        timestamp: "{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}"
        _aro_cmd: "{{ 'az aro hcp cluster' if aro_architecture == 'hcp' else 'az aro' }}"

    - name: Check if ARO cluster exists
      ansible.builtin.command: >
        {{ _aro_cmd }} show --name {{ cluster_name }} --resource-group {{ resource_group }} -o json
      register: aro_exists
      failed_when: false
      changed_when: false

    - name: Nothing to delete
      ansible.builtin.debug:
        msg: "No {{ aro_architecture }} cluster '{{ cluster_name }}' in '{{ resource_group }}'."
      when: aro_exists.rc != 0

    - name: Confirm cluster deletion
      ansible.builtin.pause:
        prompt: |
          WARNING: delete {{ aro_architecture }} ARO cluster '{{ cluster_name }}' in '{{ resource_group }}'?
          This cannot be undone. Type 'yes' to continue
      register: confirmation
      when: aro_exists.rc == 0 and not (auto_approve | bool)

    - name: Abort unless confirmed
      ansible.builtin.fail:
        msg: Deletion aborted by user
      when:
        - aro_exists.rc == 0
        - not (auto_approve | bool)
        - confirmation.user_input | default('') != 'yes'

    - name: Delete classic cluster
      ansible.builtin.command: >
        az aro delete --name {{ cluster_name }} --resource-group {{ resource_group }} --yes
      when: aro_exists.rc == 0 and aro_architecture == 'classic'
      changed_when: true

    # Generic ARM delete; blocks until the cluster (and its node pools) are gone
    - name: Delete HCP cluster
      ansible.builtin.command: az resource delete --ids {{ (aro_exists.stdout | from_json).id }}
      when: aro_exists.rc == 0 and aro_architecture == 'hcp'
      changed_when: true

    - name: Confirm resource group deletion
      ansible.builtin.pause:
        prompt: |
          Also delete resource group '{{ resource_group }}' and EVERYTHING in it
          (VNet, identities, Key Vault)? Type 'yes' to delete, anything else to keep
      register: rg_confirmation
      when: not (auto_approve | bool)

    - name: Decide on resource group deletion
      ansible.builtin.set_fact:
        _delete_rg: >-
          {{ (delete_resource_group | bool) if (auto_approve | bool)
             else (rg_confirmation.user_input | default('') == 'yes') }}

    - name: Delete resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}"
        state: absent
        force_delete_nonempty: true
      when: _delete_rg | bool

    # Key Vaults are soft-deleted with their RG. Purge it so the same
    # deterministic name can be reused on the next HCP deployment.
    - name: Purge soft-deleted HCP Key Vault
      ansible.builtin.command: >
        az keyvault purge --name {{ hcp_keyvault_name_effective }} --location {{ location }}
      register: kv_purge
      failed_when: kv_purge.rc != 0 and 'not found' not in (kv_purge.stderr | lower)
      changed_when: kv_purge.rc == 0
      when: aro_architecture == 'hcp' and (_delete_rg | bool)

    - name: Remove local credentials for the deleted cluster
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - vars/kubeconfig-{{ cluster_name }}
        - vars/aro-cluster-info-{{ cluster_name }}.txt
        - vars/aro-hcp-params-{{ cluster_name }}.json
      when: aro_exists.rc == 0

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          {{ 'Cluster ' ~ cluster_name ~ ' deleted. ' if aro_exists.rc == 0 else '' }}Resource group
          '{{ resource_group }}' {{ 'deleted' if _delete_rg | bool else 'preserved' }}.
