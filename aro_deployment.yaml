---
# Description
# ===========
# Deploys Azure Red Hat OpenShift in either architecture:
#   aro_architecture: classic  -> standard ARO (GA)        tasks/deploy_classic.yml
#   aro_architecture: hcp      -> ARO with hosted control planes (public preview)
#                                                          tasks/deploy_hcp.yml
#
# Usage:
#   ansible-playbook aro_deployment.yaml                         # classic
#   ansible-playbook aro_deployment.yaml -e aro_architecture=hcp -e location=eastus2
#
# Prerequisites:
#  - az login
#  - ansible-galaxy collection install azure.azcollection
#  - classic: vars/pull-secret.txt (from console.redhat.com)
#  - hcp: Azure CLI >= 2.67, Owner (or Contributor + User Access Administrator)
#    on the subscription/RG. The ARO HCP CLI extension is installed automatically.

- name: Deploy Azure Red Hat OpenShift
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/aro_vars.yml

  pre_tasks:
    - name: Validate architecture choice
      ansible.builtin.assert:
        that: aro_architecture in ['classic', 'hcp']
        fail_msg: "aro_architecture must be 'classic' or 'hcp' (got '{{ aro_architecture }}')"
        quiet: true

  tasks:
    - name: Run pre-flight checks
      ansible.builtin.include_tasks: tasks/preflight.yml

    - name: Ensure resource group exists
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}"
        location: "{{ location }}"
        tags: "{{ aro_tags }}"

    - name: Deploy cluster ({{ aro_architecture }})
      ansible.builtin.include_tasks: "tasks/deploy_{{ aro_architecture }}.yml"
